message: |
  Отправьте пост для рассылки:

editing:
  message: |
    Отправьте новый пост для рассылки:

preview:
  message: |
    ⚙️ Настройки рассылки:

attach_tournament:
  message: |
    Выберите турнир для кнопки быстрой регистрации:
  none_available: |
    Нет турниров в статусе "В очереди" для прикрепления кнопки.
  attached: |
    Кнопка турнира прикреплена ✅
  detached: |
    Кнопка турнира убрана
  skipped_for_media: |
    ⚠️ Кнопка турнира не прикреплена — Telegram не поддерживает кнопки для сообщений с альбомом.

run:
  message: |
    <b>Рассылка запущена 🚀</b>

    Кол-во пользователей: {total_users}
    ID рассылки: {spamming_id}

results:
  message: |
    <b>✅ Рассылка завершена!</b>
    Пользователей: {total}
    Отправлено: {successful}
    Не отправлено: {failed}

    ID рассылки: {spamming_id}

errors:
  spamming_is_running:
    message: |
      Дождитесь пока закончится запущенная рассылка!

  length_limit:
    message: |
      <b>Длина поста не должна превышать 1000 символов!</b>

      Отправьте новый пост для рассылки: